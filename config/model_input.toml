# Settings for building the model input.
# Work package E, decisions E4 and E5. Contains no credentials.

[model_input]
# Selection, decision E4.
exclude_bots = true
exclude_open = true
include_drafts = true

# Budget, decision E5.
# Upper limit for the diff context that GitHub attaches to a review
# comment. The full context repeats code that is already in the file
# diff; across the 395 selected pull requests it amounted to more
# characters than the whole truncated diff.
max_diff_hunk_chars = 500
# Upper limit for one assembled source block. Prose is kept first,
# file diffs are cut first.
max_input_chars_per_pull = 80000
truncation_marker = "\n[... truncated ...]\n"

[pseudonymisation]
# Decision E9. Mentions of logins in prose are replaced before the text
# is handed to an external model. Never in code: the context rules of
# pseudonymise.py plus this allowlist keep decorators out of the mapping.
# The three names below appear in prose in the data of 2026-09-15 and
# denote decorators, not people.
enabled = true
placeholder_prefix = "person"
# RUS stands for Repeat-Until-Success and also occurs in the code.
allowlist = ["jaspify", "jax", "pytest", "rus"]
# Outside the repository: the mapping can undo the replacement.
mapping_file = "data/interim/mention_map.json"
